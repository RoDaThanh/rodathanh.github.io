<style>
/* Layout: one centered column — today's status, the big streak number, the year grid, stats, share bar. */
:root{
  --bg:#0b0f0c; --panel:#121814; --line:#223027; --fg:#e8efe9; --muted:#8b9a90;
  --l0:#18211b; --l1:#0e4429; --l2:#006d32; --l3:#26a641; --l4:#39d353;
  --warn:#f0b429; --accent:#39d353;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root{
  --bg:#f5f8f5; --panel:#ffffff; --line:#dbe4dd; --fg:#122016; --muted:#5d6e62;
  --l0:#e7ede8; --l1:#9be9a8; --l2:#40c463; --l3:#30a14e; --l4:#216e39;
  --warn:#b7791f; --accent:#1f883d; color-scheme:light;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--mono);
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased}
main{max-width:860px;margin:0 auto;display:grid;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who img{width:36px;height:36px;border-radius:50%;background:var(--l0)}
.who a{color:var(--fg);text-decoration:none;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.who a:hover{text-decoration:underline}
.pill{font-size:12px;letter-spacing:.04em;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.pill.live::before{animation:none}}

.hero{display:grid;gap:4px}
.today{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.today.done{color:var(--accent)} .today.risk{color:var(--warn)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(64px,18vw,148px);line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big small{font-size:.28em;font-weight:500;letter-spacing:-.01em;color:var(--muted);margin-left:.25em}
.nudge{font-family:var(--display);font-weight:500;font-size:clamp(17px,3.6vw,21px);text-wrap:balance;max-width:40ch}

.board{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.board svg{width:100%;height:auto;display:block}
.legend{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}
.legend .scale{display:flex;align-items:center;gap:3px}
.legend .scale i{width:11px;height:11px;border-radius:2px;display:inline-block}
.tip{font-size:12px;color:var(--muted);min-height:18px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--panel);padding:14px 16px;display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.actions{display:flex;gap:10px;flex-wrap:wrap}
button,.btn{font:600 14px var(--mono);padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#04140a}
button:hover{filter:brightness(1.1)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
form{display:flex;gap:8px;flex-wrap:wrap}
input{font:15px var(--mono);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);flex:1 1 180px;min-width:0}
.foot{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.err{color:var(--warn)}
</style>
</head>
<body>
<main>
  <header>
    <div class="who">
      <img id="avatar" alt="" width="36" height="36">
      <a id="handle" href="#" target="_blank" rel="noopener">…</a>
    </div>
    <span class="pill live" id="status">Loading</span>
  </header>

  <section class="hero" aria-live="polite">
    <div class="today" id="today">Checking today…</div>
    <div class="big"><span id="streak">–</span><small>day streak</small></div>
    <div class="nudge" id="nudge">&nbsp;</div>
  </section>

  <section class="board">
    <svg id="grid" role="img" aria-label="Contribution calendar"></svg>
    <div class="legend">
      <span class="tip" id="tip">Tap a square for details</span>
      <span class="scale">Less <i style="background:var(--l0)"></i><i style="background:var(--l1)"></i><i style="background:var(--l2)"></i><i style="background:var(--l3)"></i><i style="background:var(--l4)"></i> More</span>
    </div>
  </section>

  <section class="stats">
    <div class="stat"><b id="sTotal">–</b><span>Past year</span></div>
    <div class="stat"><b id="sBest">–</b><span>Best streak</span></div>
    <div class="stat"><b id="sWeek">–</b><span>This week</span></div>
    <div class="stat"><b id="sActive">–</b><span>Active days</span></div>
  </section>

  <div class="actions">
    <button class="primary" id="shareBtn" type="button">Share</button>
    <button id="imgBtn" type="button">Save image</button>
    <button id="copyBtn" type="button">Copy link</button>
  </div>

  <form id="userForm">
    <label for="userInput" style="position:absolute;left:-9999px">GitHub username</label>
    <input id="userInput" name="u" placeholder="GitHub username" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit">Show</button>
  </form>

  <div class="foot">
    <span id="updated">&nbsp;</span>
    <span>Refreshes every 10 min · data via GitHub public profile</span>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const API = u => `https://github-contributions-api.jogruber.de/v4/${encodeURIComponent(u)}?y=last`;
const REFRESH_MS = 10 * 60 * 1000;
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k) } catch { return null } },
  set(k,v){ try { localStorage.setItem(k,v) } catch {} }
};

let user = new URLSearchParams(location.search).get('u') || store.get('streak.user') || 'rodathanh';
let data = null;

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDate = s => new Date(s+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});

function compute(days){
  const todayIso = iso(new Date());
  days = days.filter(d => d.date <= todayIso);
  const map = Object.fromEntries(days.map(d => [d.date, d.count]));
  const todayCount = map[todayIso] || 0;

  // Current streak: today counts if done; if not yet, the streak from yesterday is still alive.
  let streak = 0, cur = new Date();
  if (!todayCount) cur.setDate(cur.getDate()-1);
  while ((map[iso(cur)] || 0) > 0) { streak++; cur.setDate(cur.getDate()-1); }

  let best = 0, run = 0;
  for (const d of days) { run = d.count > 0 ? run+1 : 0; best = Math.max(best, run); }

  const now = new Date(), monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay()+6)%7));
  const weekStart = iso(monday);
  const week = days.filter(d => d.date >= weekStart).reduce((a,d)=>a+d.count,0);
  const active = days.filter(d => d.count > 0).length;
  const total = days.reduce((a,d)=>a+d.count,0);
  return {days, todayCount, streak, best, week, active, total};
}

function nudgeText(s){
  if (s.todayCount && s.streak >= s.best && s.best > 1) return `New personal best. Every day from here sets the record.`;
  if (s.todayCount) return `Today is in. ${s.best - s.streak > 0 ? `${s.best - s.streak} more ${s.best - s.streak === 1 ? 'day' : 'days'} to beat your best of ${s.best}.` : 'Come back tomorrow.'}`;
  if (s.streak) return `Ship one commit before midnight to make it ${s.streak + 1}.`;
  return `Zero today. One commit starts a new streak.`;
}

function render(){
  const s = compute(data.contributions);
  $('streak').textContent = s.streak;
  const t = $('today');
  t.className = 'today ' + (s.todayCount ? 'done' : 'risk');
  t.textContent = s.todayCount ? `Today: ${s.todayCount} contribution${s.todayCount>1?'s':''}` : (s.streak ? 'Today: streak at risk' : 'Today: nothing yet');
  $('nudge').textContent = nudgeText(s);
  $('sTotal').textContent = s.total.toLocaleString();
  $('sBest').textContent = s.best;
  $('sWeek').textContent = s.week;
  $('sActive').textContent = s.active;
  drawGrid(s.days);
  document.title = `${s.streak}-day streak · ${user}`;
  window._s = s;
}

function drawGrid(all){
  // Phones get the last ~6 months so squares stay tappable.
  const days = innerWidth < 600 ? all.slice(-26*7) : all;
  const cell = 11, gap = 3, step = cell+gap, top = 18, left = 26;
  const first = new Date(days[0].date+'T00:00:00');
  const offset = first.getDay(); // Sunday-first rows like GitHub
  const weeks = Math.ceil((days.length + offset) / 7);
  const W = left + weeks*step, H = top + 7*step;
  const svg = $('grid');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let out = '', lastMonth = -1;
  days.forEach((d,i) => {
    const idx = i + offset, x = left + Math.floor(idx/7)*step, y = top + (idx%7)*step;
    const dt = new Date(d.date+'T00:00:00');
    if (idx%7 === 0 && dt.getMonth() !== lastMonth && dt.getDate() <= 7) {
      lastMonth = dt.getMonth();
      if (x < W - 20) out += `<text x="${x}" y="11" font-size="9" fill="var(--muted)" font-family="var(--mono)">${dt.toLocaleDateString(undefined,{month:'short'})}</text>`;
    }
    out += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="2" fill="var(--l${d.level})" data-d="${d.date}" data-c="${d.count}" tabindex="-1"></rect>`;
  });
  ['Mon','Wed','Fri'].forEach((n,k) => out += `<text x="0" y="${top + (1+2*k)*step + 9}" font-size="9" fill="var(--muted)" font-family="var(--mono)">${n}</text>`);
  svg.innerHTML = out;
}

let lastNarrow = innerWidth < 600;
addEventListener('resize', () => { const n = innerWidth < 600; if (n !== lastNarrow && window._s) { lastNarrow = n; drawGrid(window._s.days); } });
$('grid').addEventListener('click', showTip);
$('grid').addEventListener('mousemove', showTip);
function showTip(e){
  const r = e.target.closest('rect'); if (!r) return;
  const c = +r.dataset.c;
  $('tip').textContent = `${c || 'No'} contribution${c===1?'':'s'} on ${fmtDate(r.dataset.d)}`;
}

async function load(){
  $('status').textContent = 'Updating';
  try {
    const res = await fetch(API(user), {cache:'no-store'});
    if (!res.ok) throw new Error(res.status === 404 ? `No GitHub user named “${user}”.` : `GitHub data is unavailable right now (${res.status}).`);
    data = await res.json();
    if (!data.contributions?.length) throw new Error(`No public contributions found for “${user}”.`);
    $('avatar').src = `https://github.com/${encodeURIComponent(user)}.png?size=72`;
    $('handle').textContent = '@' + user;
    $('handle').href = `https://github.com/${encodeURIComponent(user)}`;
    $('userInput').value = user;
    render();
    $('status').textContent = 'Live';
    $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  } catch (err) {
    $('status').textContent = 'Offline';
    $('nudge').innerHTML = '';
    const span = document.createElement('span'); span.className = 'err'; span.textContent = err.message || 'Could not load data. Check your connection.';
    $('nudge').append(span);
  }
}

$('userForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('userInput').value.trim().replace(/^@/,'');
  if (!v) return;
  user = v; store.set('streak.user', v);
  history.replaceState(null, '', `?u=${encodeURIComponent(v)}`);
  load();
});

function shareUrl(){ return `${location.origin}${location.pathname}?u=${encodeURIComponent(user)}`; }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(shareUrl()); toast('Link copied'); }
  catch { prompt('Copy this link', shareUrl()); }
};

// 1200×627 card sized for LinkedIn / X posts.
async function makeImage(){
  const s = window._s; if (!s) return null;
  await document.fonts.ready;
  const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n).trim();
  const c = document.createElement('canvas'); c.width = 1200; c.height = 627;
  const g = c.getContext('2d');
  g.fillStyle = v('--bg'); g.fillRect(0,0,1200,627);
  g.fillStyle = v('--muted'); g.font = '600 26px "IBM Plex Mono", monospace';
  g.fillText('@' + user + '  ·  GitHub', 64, 84);
  g.fillStyle = v('--fg'); g.font = '800 170px "Bricolage Grotesque", sans-serif';
  g.fillText(String(s.streak), 60, 250);
  const w = g.measureText(String(s.streak)).width;
  g.fillStyle = v('--muted'); g.font = '500 44px "Bricolage Grotesque", sans-serif';
  g.fillText('day streak', 60 + w + 20, 250);
  const first = new Date(s.days[0].date+'T00:00:00'), off = first.getDay(), step = 20.5, cs = 17;
  s.days.forEach((d,i) => {
    const idx = i+off; g.fillStyle = v('--l'+d.level);
    const x = 64 + Math.floor(idx/7)*step, y = 300 + (idx%7)*step;
    g.beginPath(); g.roundRect ? g.roundRect(x,y,cs,cs,3) : g.rect(x,y,cs,cs); g.fill();
  });
  g.font = '600 26px "IBM Plex Mono", monospace';
  [[s.total.toLocaleString(),'past year'],[s.best,'best streak'],[s.active,'active days']].forEach(([n,l],k) => {
    const x = 64 + k*360;
    g.fillStyle = v('--fg'); g.fillText(String(n), x, 495+70);
    g.fillStyle = v('--muted'); g.fillText(l, x + g.measureText(String(n)+' ').width, 495+70);
  });
  return new Promise(r => c.toBlob(r, 'image/png'));
}

$('imgBtn').onclick = async () => {
  const blob = await makeImage(); if (!blob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `streak-${user}.png`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  toast('Image saved');
};

$('shareBtn').onclick = async () => {
  const s = window._s;
  const text = s ? `${s.streak}-day GitHub streak and counting. ${s.total.toLocaleString()} contributions this past year.` : 'My GitHub streak';
  try {
    const blob = await makeImage();
    const file = blob && new File([blob], `streak-${user}.png`, {type:'image/png'});
    if (file && navigator.canShare?.({files:[file]})) await navigator.share({files:[file], text: text + ' ' + shareUrl()});
    else if (navigator.share) await navigator.share({title:'Streakboard', text, url: shareUrl()});
    else window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl())}`, '_blank', 'noopener');
  } catch (e) { if (e.name !== 'AbortError') toast('Sharing was cancelled'); }
};

load();
setInterval(load, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
